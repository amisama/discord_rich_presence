[package]
name = "discord_rich"
version = "0.1.1"
edition = "2021"
description = "Custom Discord Rich Presence with auto-detection of active apps (VSCode, Warp, SSH, browsers, etc.)"
authors = ["amisama"]
license = "MIT"
repository = "https://github.com/amisama/discord_rich_presence"
readme = "README.md"

[[bin]]
name = "discord_rich"
path = "src/main.rs"

[dependencies]
# Discord IPC
discord-rich-presence = "0.2"

# Active window detection (cross-platform)
active-win-pos-rs = "0.8"

# Process info
sysinfo = "0.32"

# Tray icon (Tauri team)
tray-icon = "0.19"

# Native UI for settings window
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# Utilities
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
regex = "1"

# Event loop / windowing for tray
tao = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---------- Linux: cargo-deb ----------
[package.metadata.deb]
maintainer = "amisama"
copyright = "2026, amisama"
license-file = ["LICENSE", "0"]
extended-description = """\
discord_rich is a custom Discord Rich Presence client that watches the active
window on your system and updates Discord based on rules you define. Works \
with any application — VSCode, Cursor, Warp, terminals, browsers, SSH \
sessions, and more — without editor-specific extensions."""
section = "utility"
priority = "optional"
depends = "$auto, libgtk-3-0, libxdo3, libayatana-appindicator3-1 | libappindicator3-1"
assets = [
    ["target/release/discord_rich", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/discord_rich/README", "644"],
    ["LICENSE", "usr/share/doc/discord_rich/LICENSE", "644"],
    ["packaging/linux/discord_rich.desktop", "usr/share/applications/", "644"],
]

# ---------- Windows: cargo-wix ----------
[package.metadata.wix]
upgrade-guid = "8B5C9F4C-3D2E-4A1F-9E6B-2A1C8D7F0B12"
path-guid    = "C9A8E1B4-5F22-4D7A-B9E3-7F4A6C2D9E80"
license = false
eula = false
